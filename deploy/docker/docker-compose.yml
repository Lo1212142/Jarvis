services:
  jarvis:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENJARVIS_ENGINE_DEFAULT=${OPENJARVIS_ENGINE_DEFAULT:-nim}
      - OLLAMA_HOST=http://ollama:11434
      - NIM_HOST=${NIM_HOST:-https://integrate.api.nvidia.com}
      - NIM_API_KEY=${NIM_API_KEY:-}
      - NIM_RPM_LIMIT=40
      - NIM_RPM_QUEUE_TIMEOUT=${NIM_RPM_QUEUE_TIMEOUT:-600}
      # The container binds 0.0.0.0, so an API key is REQUIRED. Compose fails
      # fast if OPENJARVIS_API_KEY is unset (set it in deploy/docker/.env —
      # see .env.example, or `export` it). Generate one: `jarvis auth generate-key`.
      - OPENJARVIS_API_KEY=${OPENJARVIS_API_KEY:?OPENJARVIS_API_KEY must be set (see deploy/docker/.env.example)}
    # NIM is the default remote engine; the local Ollama service is optional
    # and enabled only with `--profile local-llm`.
    volumes:
      - jarvis-data:/home/openjarvis/.openjarvis
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    cpus: ${JARVIS_CPU_LIMIT:-2.0}
    mem_limit: ${JARVIS_MEMORY_LIMIT:-768m}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  ollama:
    profiles: ["local-llm"]
    # Pinned to a fixed version + digest for reproducible deployments and
    # predictable rollbacks (#563). Bump deliberately, not implicitly via :latest.
    image: ollama/ollama:0.30.10@sha256:bfc9c6d53cc6989aa5131a6fde6b162b2802d4d337657f3253b5f69579bddeee
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  ollama-models:
  jarvis-data:
